<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinder-Tastatur: Buchstaben und Zahlen lernen mit Tieren und Sprache">
    <title>Kinder-Tastatur</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(180deg, #fff6d6 0%, #ffe3ef 100%);
            color: #3b2c5a;
            font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 16px 24px;
        }
        .top {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .tool {
            font: inherit;
            font-size: 22px;
            background: #fff;
            border: 3px solid #3b2c5a22;
            border-radius: 14px;
            padding: 4px 10px;
            cursor: pointer;
        }
        .display {
            width: 100%;
            max-width: 900px;
            min-height: 190px;
            margin: 8px 0 16px;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 6px 0 #3b2c5a22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
        }
        .display .big {
            font-size: 72px;
            line-height: 1.1;
            font-weight: bold;
        }
        .display .emoji {
            font-size: 64px;
            line-height: 1.2;
        }
        .display .word {
            font-size: 32px;
        }
        .display .word b {
            color: #e5486b;
        }
        .display .dots {
            font-size: 30px;
            line-height: 1.3;
            max-width: 340px;
        }
        .display .question {
            font-size: 34px;
            font-weight: bold;
        }
        .display .question b {
            color: #e5486b;
            font-size: 56px;
        }
        .display .score {
            font-size: 24px;
            align-self: flex-end;
        }
        .display .hint {
            font-size: 22px;
            opacity: .7;
        }
        .pop {
            animation: pop .45s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(.4); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }
        .keys {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 10px;
        }
        .keys + .keys {
            margin-top: 18px;
        }
        .key {
            font: inherit;
            color: #3b2c5a;
            background: var(--c);
            border: none;
            border-radius: 20px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, .18);
            min-height: 84px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform .08s, box-shadow .08s;
        }
        .key:active, .key.pressed {
            transform: translateY(5px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, .18);
        }
        .key.shake {
            animation: shake .4s;
        }
        @keyframes shake {
            0%, 100% { translate: 0; }
            25% { translate: -8px; }
            75% { translate: 8px; }
        }
        .key.correct {
            animation: correct .6s;
        }
        @keyframes correct {
            0%, 100% { scale: 1; }
            50% { scale: 1.25; }
        }
        .key.hint {
            animation: glow 1s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 6px 0 rgba(0, 0, 0, .18), 0 0 0 0 #ffffff; }
            50% { box-shadow: 0 6px 0 rgba(0, 0, 0, .18), 0 0 0 8px #ffffff, 0 0 24px 10px #ffd400; }
        }
        .key .l {
            font-size: 30px;
            font-weight: bold;
        }
        .key .l small {
            font-size: 22px;
        }
        .key .e {
            font-size: 26px;
        }
        .key.num .l {
            font-size: 38px;
        }
        .debug {
            width: 100%;
            max-width: 900px;
            margin-top: 18px;
            font-family: monospace;
            -webkit-user-select: text;
            user-select: text;
        }
        .debug-tests {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .debug button {
            font: inherit;
            padding: 6px 8px;
        }
        .debug textarea {
            width: 100%;
            height: 260px;
            font: 12px monospace;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <div class="top">
        <button class="tool" id="repeat" title="Frage wiederholen" hidden>🔊</button>
        <button class="tool" id="mode" title="Quiz / Lernen">🎯 Quiz</button>
        <button class="tool" id="fullscreen" title="Vollbild">⛶</button>
    </div>
    <div class="display" id="display">
        <div class="emoji">🐒🐻🦁</div>
        <div class="hint">Tippe auf einen Buchstaben oder eine Zahl!</div>
    </div>
    <div class="keys" id="letters"></div>
    <div class="keys" id="numbers"></div>
    <div class="debug" id="debug" hidden>
        <div class="debug-tests">
            <button data-say="D">„D“</button>
            <button data-say="Delfin">„Delfin“</button>
            <button data-say="D wie Delfin">„D wie Delfin“</button>
            <button data-say="D wie Delfin" data-novoice>„D wie Delfin“ ohne Stimme</button>
            <button data-say="drei" data-novoice>„drei“ ohne Stimme</button>
            <button id="debugCopy">Log kopieren</button>
        </div>
        <textarea id="debugLog" readonly></textarea>
    </div>

    <script>
        const LETTERS = [
            ['A', 'Affe', '🐒'], ['B', 'Bär', '🐻'], ['C', 'Chamäleon', '🦎'],
            ['D', 'Delfin', '🐬'], ['E', 'Elefant', '🐘'], ['F', 'Frosch', '🐸'],
            ['G', 'Giraffe', '🦒'], ['H', 'Hase', '🐰'], ['I', 'Igel', '🦔'],
            ['J', 'Jaguar', '🐆'], ['K', 'Katze', '🐱'], ['L', 'Löwe', '🦁'],
            ['M', 'Marienkäfer', '🐞'], ['N', 'Nashorn', '🦏'], ['O', 'Orca', '🐋'],
            ['P', 'Pinguin', '🐧'], ['Q', 'Qualle', '🪼'], ['R', 'Raupe', '🐛'],
            ['S', 'Schaf', '🐑'], ['T', 'Tiger', '🐯'], ['U', 'Uhu', '🦉'],
            ['V', 'Vogel', '🐦'], ['W', 'Wal', '🐳'], ['X', 'Xylophon', '🎵'],
            ['Y', 'Yak', '🐃'], ['Z', 'Zebra', '🦓']
        ];
        const NUMBERS = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun'];
        const COLORS = ['#ff9aa2', '#ffb870', '#ffe066', '#b5ea8c', '#8fd8f8', '#b9a6ff', '#ffa8e0'];

        const display = document.getElementById('display');
        const lettersEl = document.getElementById('letters');
        const numbersEl = document.getElementById('numbers');
        const keyByChar = {};

        // Debug mode (?debug in the URL): log speech events and errors on the page
        const DEBUG = new URLSearchParams(location.search).has('debug');
        const debugLog = document.getElementById('debugLog');
        const t0 = Date.now();
        function log(msg, isError) {
            if (!DEBUG) return;
            const line = `[${((Date.now() - t0) / 1000).toFixed(2)}s] ${msg}`;
            debugLog.value += line + '\n';
            debugLog.scrollTop = debugLog.scrollHeight;
            if (isError) alert(line);
        }
        if (DEBUG) {
            document.getElementById('debug').hidden = false;
            log('UA: ' + navigator.userAgent);
            log('speechSynthesis supported: ' + ('speechSynthesis' in window));
            window.addEventListener('error', e => log(`JS error: ${e.message} (${e.lineno}:${e.colno})`, true));
            window.addEventListener('unhandledrejection', e => log('Promise error: ' + e.reason, true));
            document.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click',
                () => speak(b.dataset.say, { noVoice: b.hasAttribute('data-novoice') })));
            document.getElementById('debugCopy').addEventListener('click', () => {
                debugLog.select();
                (navigator.clipboard ? navigator.clipboard.writeText(debugLog.value) : Promise.reject())
                    .catch(() => document.execCommand('copy'));
            });
        }
        const describeVoice = v => v ? `${v.name} | ${v.lang} | local=${v.localService} | default=${v.default}` : 'none';

        // Speech: prefer a German voice; voices may load asynchronously
        let germanVoice = null;
        function pickVoice() {
            const voices = speechSynthesis.getVoices();
            germanVoice = voices.find(v => v.lang === 'de-DE') ||
                voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de')) || null;
            log(`voices loaded: ${voices.length}, picked: ${describeVoice(germanVoice)}`);
            voices.filter(v => /^de/i.test(v.lang)).forEach(v => log('  de voice: ' + describeVoice(v)));
        }
        if ('speechSynthesis' in window) {
            pickVoice();
            speechSynthesis.addEventListener('voiceschanged', pickVoice);
        }
        // Chrome (esp. Android) silently drops speak() called right after cancel(),
        // and may stop speaking if the utterance gets garbage collected, so we keep
        // a reference and wait briefly after cancelling.
        let currentUtterance = null;
        let speakTimer = null;
        function speak(text, { noVoice = false, onEnd = null } = {}) {
            if (!('speechSynthesis' in window)) {
                if (onEnd) setTimeout(onEnd, 1500);
                return;
            }
            const synth = speechSynthesis;
            clearTimeout(speakTimer);
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'de-DE';
            if (germanVoice && !noVoice) u.voice = germanVoice;
            u.rate = 0.85;
            u.pitch = 1.1;
            currentUtterance = u;
            // onEnd runs once when this utterance finishes, fails, or seems stuck,
            // but not when a newer speak() replaced it
            let finished = false;
            const done = () => {
                if (finished || currentUtterance !== u) return;
                finished = true;
                if (onEnd) onEnd();
            };
            setTimeout(done, 8000);
            let started = false;
            log(`speak "${text}" voice=${describeVoice(u.voice)} | speaking=${synth.speaking} pending=${synth.pending} paused=${synth.paused}`);
            u.onstart = () => { started = true; log(`  start "${text}"`); };
            u.onend = () => { log(`  end "${text}"`); done(); };
            u.onerror = e => {
                // 'interrupted'/'canceled' are expected when a new key cuts off the previous word
                const expected = e.error === 'interrupted' || e.error === 'canceled';
                log(`  ${expected ? 'stopped' : 'SPEECH ERROR'} "${text}": ${e.error}`, !expected);
                done();
            };
            if (DEBUG) {
                setTimeout(() => { if (!started && currentUtterance === u) log(`  NO START after 3s "${text}"`, true); }, 3000);
            }
            const start = () => {
                synth.resume();
                synth.speak(currentUtterance);
            };
            if (synth.speaking || synth.pending) {
                synth.cancel();
                speakTimer = setTimeout(start, 150);
            } else {
                start();
            }
        }

        function show(html) {
            display.innerHTML = html;
            display.classList.remove('pop');
            void display.offsetWidth;
            display.classList.add('pop');
        }

        function flash(btn, cls) {
            btn.classList.remove(cls);
            void btn.offsetWidth;
            btn.classList.add(cls);
        }

        // Every key is an item; learn mode and quiz mode both work on items
        const ITEMS = [];
        LETTERS.forEach(([letter, word, emoji], i) => ITEMS.push({
            char: letter,
            keyHtml: `<span class="l">${letter}<small>${letter.toLowerCase()}</small></span><span class="e">${emoji}</span>`,
            color: COLORS[i % COLORS.length],
            parent: lettersEl,
            learnHtml: `<div class="big">${letter} ${letter.toLowerCase()}</div>` +
                `<div class="emoji">${emoji}</div>` +
                `<div class="word"><b>${word[0]}</b>${word.slice(1)}</div>`,
            learnSay: `${letter} wie ${word}`,
            emoji,
            question: `Wo ist das ${letter}?`,
            questionHtml: `Wo ist das <b>${letter}</b>?`,
            rightSay: `Super! ${letter} wie ${word}!`,
            wrongSay: `Das ist ${letter} wie ${word}.`
        }));
        NUMBERS.forEach((word, n) => {
            const digit = String(n);
            const dots = n === 0 ? '&nbsp;' : '🔴'.repeat(n);
            ITEMS.push({
                char: digit,
                keyHtml: `<span class="l">${digit}</span>`,
                color: COLORS[(n + 3) % COLORS.length],
                parent: numbersEl,
                extraClass: 'num',
                learnHtml: `<div class="big">${digit}</div>` +
                    `<div class="dots">${dots}</div>` +
                    `<div class="word">${word}</div>`,
                learnSay: word,
                emoji: `<span class="dots">${dots}</span>`,
                question: `Wo ist die ${word}?`,
                questionHtml: `Wo ist die <b>${digit}</b>?`,
                rightSay: `Super! Das ist die ${word}!`,
                wrongSay: `Das ist die ${word}.`
            });
        });

        // Quiz state: null in learn mode
        let quiz = null;

        function learn(item) {
            show(item.learnHtml);
            speak(item.learnSay);
        }

        function askQuestion() {
            show(`<div class="score">⭐ ${quiz.score}</div>` +
                `<div class="emoji">🤔</div>` +
                `<div class="question">${quiz.target.questionHtml}</div>`);
            speak(quiz.target.question);
        }

        function nextQuestion() {
            if (!quiz) return;
            document.querySelectorAll('.key.hint').forEach(k => k.classList.remove('hint'));
            let target;
            do {
                target = ITEMS[Math.floor(Math.random() * ITEMS.length)];
            } while (target === quiz.target);
            quiz.target = target;
            quiz.wrong = 0;
            quiz.busy = false;
            askQuestion();
        }

        function answer(item) {
            if (quiz.busy) return;
            const target = quiz.target;
            if (item === target) {
                quiz.score++;
                quiz.busy = true;
                flash(item.btn, 'correct');
                show(`<div class="score">⭐ ${quiz.score}</div>` +
                    `<div class="emoji">🎉 ${target.emoji} 🎉</div>` +
                    `<div class="question">Super!</div>`);
                speak(target.rightSay, { onEnd: () => setTimeout(nextQuestion, 400) });
            } else {
                quiz.wrong++;
                flash(item.btn, 'shake');
                // After two wrong tries, make the right key glow as a hint
                if (quiz.wrong >= 2) target.btn.classList.add('hint');
                speak(`${item.wrongSay} ${target.question}`);
            }
        }

        ITEMS.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'key' + (item.extraClass ? ' ' + item.extraClass : '');
            btn.style.setProperty('--c', item.color);
            btn.innerHTML = item.keyHtml;
            btn.addEventListener('click', () => (quiz ? answer(item) : learn(item)));
            item.parent.appendChild(btn);
            item.btn = btn;
            keyByChar[item.char] = btn;
        });

        // Switch between learn mode and quiz mode
        const modeBtn = document.getElementById('mode');
        const repeatBtn = document.getElementById('repeat');
        const startHtml = display.innerHTML;
        modeBtn.addEventListener('click', () => {
            if (quiz) {
                quiz = null;
                document.querySelectorAll('.key.hint').forEach(k => k.classList.remove('hint'));
                modeBtn.textContent = '🎯 Quiz';
                repeatBtn.hidden = true;
                show(startHtml);
                speak('Lernen');
            } else {
                quiz = { score: 0, wrong: 0, target: null, busy: false };
                modeBtn.textContent = '🔤 Lernen';
                repeatBtn.hidden = false;
                nextQuestion();
            }
        });
        // Repeat the question (button or tap on the display)
        const repeatQuestion = () => {
            if (quiz && !quiz.busy) speak(quiz.target.question);
        };
        repeatBtn.addEventListener('click', repeatQuestion);
        display.addEventListener('click', repeatQuestion);

        // Physical keyboard support
        document.addEventListener('keydown', e => {
            if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
            const btn = keyByChar[e.key.toUpperCase()];
            if (!btn) return;
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 120);
            btn.click();
        });

        // Fullscreen toggle (hidden where unsupported, e.g. iPhone Safari)
        const fsBtn = document.getElementById('fullscreen');
        if (!document.fullscreenEnabled) {
            fsBtn.style.display = 'none';
        } else {
            fsBtn.addEventListener('click', () => {
                if (document.fullscreenElement) document.exitFullscreen();
                else document.documentElement.requestFullscreen();
            });
        }
    </script>
</body>
</html>
